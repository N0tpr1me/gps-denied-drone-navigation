[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dronenav"
version = "0.0.1"
description = "Structure Hold: gust-robust, GPS-free station keeping near structures for PX4 quadrotors"
requires-python = ">=3.10"
# Proprietary, all rights reserved (see LICENSE).
license = {file = "LICENSE"}
classifiers = ["License :: Other/Proprietary License", "Private :: Do Not Upload"]
# Core code depends on NumPy and PyYAML only, so it imports inside Isaac Lab's
# Python, the PX4 SITL image's system Python, and the dronenav conda env.
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Batched simulator and training. Not needed by the SITL harness.
# rsl_rl is pinned: its VecEnv and config layout changed between majors (docs/decisions.md).
# onnxruntime scores the exported policy.onnx, the file the PX4 module will run.
torch = ["torch>=2.6", "rsl-rl-lib==5.5.1", "onnx>=1.16", "onnxruntime>=1.17"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyulog>=1.0",
]
# Reading PX4 .ulg flight logs (eval/ulog.py). Pure Python.
ulog = ["pyulog>=1.0"]
# Host side of the Gazebo SITL runners (sim2real.px4.run_gazebo scores the flight with
# sitl_test.check_ulog, which imports pymavlink). The GPU server installs it; CI does not.
sitl = ["pyulog>=1.0", "pymavlink>=2.4.41"]

[tool.setuptools.packages.find]
include = ["envs*", "training*", "eval*"]

[tool.pytest.ini_options]
# sim2real is a namespace package (no __init__.py): pythonpath makes it importable.
# docker/ holds flight scripts (*_test.py); px4/tests holds the policy-header check.
testpaths = ["envs", "training", "eval", "sim2real/gazebo", "sim2real/estimate_bridge",
             "sim2real/px4/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["runs", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
