name: sitl-image

# Builds the PX4 SITL image on amd64 and flies the hover test. Slow (PX4 compile, about
# 13 min), so it runs only on PRs that change the image, not again after the merge to main
# (the PR already built the same files). Run it by hand on main with workflow_dispatch.
on:
  pull_request:
    paths: ["sim2real/docker/**", "sim2real/px4/**", "sim2real/gazebo/**", ".github/workflows/sitl-image.yml"]
  workflow_dispatch:

# A new push to a PR branch cancels that branch's older build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-hover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # On 1 Nov 2026 two builds died mid-step with the runner gone and no log, most likely
      # the image (PX4 clone, Gazebo Harmonic, PX4 compile, every layer kept) filling the
      # runner's disk. Drop preinstalled SDKs this job never uses and print the disk, so a
      # repeat is easy to read.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
              /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - name: Build image
        run: sim2real/docker/run.sh build
      - name: Disk after build
        if: always()
        run: df -h /
      - name: Hover test
        run: sim2real/docker/run.sh hover-test
      - name: Upload run folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitl-hover-run
          path: runs/
          if-no-files-found: warn
