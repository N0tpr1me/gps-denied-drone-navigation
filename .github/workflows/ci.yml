name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR branch cancels that branch's older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 to 3.12: the core must import in Isaac Lab, the SITL image and the Mac.
        # PRs (the merge gate) run all three; the after-merge run on main runs 3.11 only,
        # to stay inside the monthly Actions minutes.
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.10", "3.11", "3.12"]' || '["3.11"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # CPU-only PyTorch (no CUDA download) so the NumPy-vs-PyTorch parity tests run.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e .[dev,torch]
      - run: ruff check .
      # -rs prints the reason for every skipped test, so silent skips show in the log.
      - run: pytest -rs
      - name: Launch smoke run on CPU
        run: python -m training.launch --config training/configs/selfcheck.yaml --smoke --device cpu

  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No tracked file over 50 MB
        run: |
          big=$(git ls-files -z | xargs -0 -r du -k | awk '$1 > 51200 {print $2}')
          if [ -n "$big" ]; then echo "Files over 50 MB:"; echo "$big"; exit 1; fi
      - name: No Claude attribution in commit messages
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git log --format=%B "origin/${{ github.base_ref }}..HEAD" \
              | grep -iE '^(co-authored-by:.*(claude|anthropic)|claude-session:)|generated with \[?claude code'; then
            echo "Commit messages must not carry Claude attribution (project rule)."; exit 1
          fi

  px4-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Watchdog and policy controller of the Structure Hold PX4 module: plain C++, no PX4
      # tree needed. c++14 and the warning set mirror PX4's own build flags.
      - name: Watchdog unit tests
        run: |
          cd sim2real/px4/tests
          g++ -std=c++17 -Wall -Wextra -Werror -I../structure_hold test_watchdog.cpp -o test_watchdog
          ./test_watchdog
      - name: Policy controller unit tests (vs recorded Python env and onnxruntime outputs)
        run: |
          cd sim2real/px4/tests
          g++ -std=c++14 -O2 -Wall -Wextra -Werror -Wshadow -Wdouble-promotion -Wfloat-equal \
              -I../structure_hold test_policy.cpp -o test_policy
          ./test_policy
      - name: Wall guard unit tests
        run: |
          cd sim2real/px4/tests
          g++ -std=c++14 -O2 -Wall -Wextra -Werror -Wshadow -Wdouble-promotion -Wfloat-equal \
              -I../structure_hold test_wall_guard.cpp -o test_wall_guard
          ./test_wall_guard
      - name: Parameter limit unit tests
        run: |
          cd sim2real/px4/tests
          g++ -std=c++14 -O2 -Wall -Wextra -Werror -Wshadow -Wdouble-promotion -Wfloat-equal \
              -I../structure_hold test_params.cpp -o test_params
          ./test_params
      - name: Handback sequence unit tests
        run: |
          cd sim2real/px4/tests
          g++ -std=c++14 -O2 -Wall -Wextra -Werror -Wshadow -Wdouble-promotion -Wfloat-equal \
              -I../structure_hold test_handback.cpp -o test_handback
          ./test_handback
      - name: Shell scripts parse
        run: bash -n sim2real/px4/install.sh && bash -n sim2real/px4/sitl_test.sh
