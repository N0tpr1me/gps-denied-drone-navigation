# Under a bridge deck, in the corner by the abutment (world bridge_deck; docs/bridge-holds.md):
# 1 m from the abutment face and 1.5 m under the deck. The 8 m/s wind blows at 45 degrees,
# into the abutment and across the deck, so the abutment's near-wall flow (deflection, wake
# turbulence) and the deck's shelter and edge shedding all act at once.
name: deck_corner_8ms_flow
world: bridge_deck
seed: 1
spawn: {x: -1.0, y: 0.0, z: 0.0, yaw_deg: 0.0}   # 1 m from the abutment (x = 0), nose toward it
wall: {point: [0.0, 0.0, 0.0], normal_toward: [1.0, 0.0, 0.0]}
surface2: {point: [0.0, 0.0, 4.0], normal_toward: [0.0, 0.0, 1.0], across: [0.0, 1.0, 0.0]}
wind_heading_deg: 45.0  # into the abutment (+x) and across the deck (+y)
disturbance:
  mean_speed: 8.0
  num_gusts: 2
  gust_start: [40.0, 65.0]   # both inside the 60 s hover (it starts ~25 s sim time)
  gust_duration: [1.0, 2.0]
  gust_speed: [2.0, 4.0]
  turb_sigma: 1.0
  turb_tau: 1.0
  wall_deflect: [0.3, 0.8]
  wall_recirc: [0.2, 0.5]
  wake_ti: [0.1, 0.3]
  shed_amp: [0.1, 0.4]
  surface2_shed_amp: [0.1, 0.4]
  surface2_shed_width: 1.0        # the deck is 1 m deep
  surface2_shed_strouhal: [0.1, 0.15]
hover: {altitude: 2.5, hover_s: 60.0}
