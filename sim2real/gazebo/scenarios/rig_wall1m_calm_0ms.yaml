# Fan rig height (docs/fan-rig.md): wall1m_calm_0ms with the hold at 1.5 m instead of 2.5 m, so
# both controllers fly the rig's geometry in Gazebo before the first rig session. The wind
# model does not depend on height, so only the altitude differs from wall1m_calm_0ms.
# The T8 baseline scenario: as calm_0ms, 1 m from the wall, 60 s hover.
# Still air: the adapter runs but every applied force is exactly zero (still-air drag is
# subtracted). The control for the wind scenarios.
name: rig_wall1m_calm_0ms
seed: 1
spawn: {x: -1.0, y: 0.0, z: 0.0, yaw_deg: 0.0}   # 1 m from the wall (x = 0), nose toward it
wall: {point: [0.0, 0.0, 0.0], normal_toward: [1.0, 0.0, 0.0]}
disturbance:
  mean_speed: 0.0
  num_gusts: 0
  turb_sigma: 0.0
hover: {altitude: 1.5, hover_s: 60.0}
