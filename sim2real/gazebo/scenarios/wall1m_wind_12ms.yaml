# The 8 m/s benchmark scenario at 12 m/s, the top of the training wind range and the level
# the drone datasheets quote (docs/market-research.md row 15; docs/gpu-server-plan.md).
# 12 m/s mean wind blowing into the wall, 1 m off it, gusts to 16 m/s inside the 60 s hover.
# Beyond the Gazebo x500's tested envelope: a flight may crash, and that is the result.
name: wall1m_wind_12ms
seed: 1
spawn: {x: -1.0, y: 0.0, z: 0.0, yaw_deg: 0.0}   # 1 m from the wall (x = 0), nose toward it
wall: {point: [0.0, 0.0, 0.0], normal_toward: [1.0, 0.0, 0.0]}
wind_heading_deg: 0.0
disturbance:
  mean_speed: 12.0
  num_gusts: 2
  gust_start: [40.0, 65.0]   # both inside the 60 s hover (it starts ~25 s sim time)
  gust_duration: [1.0, 2.0]
  gust_speed: [2.0, 4.0]
  turb_sigma: 1.5
  turb_tau: 1.0
hover: {altitude: 2.5, hover_s: 60.0}
