# Beside a bridge pier, in its wake (world bridge_pier; docs/bridge-holds.md): 1 m in front of
# a 1.5 m square pier with the 8 m/s wind blowing away from its face, so the pier sheds
# vortices across the hold at St U / D = 0.7 to 1.1 Hz (St 0.13 for a square section to 0.2
# for a rounded one), with reverse flow and wake turbulence behind it.
name: pier_lee_8ms_flow
world: bridge_pier
seed: 1
spawn: {x: -1.0, y: 0.0, z: 0.0, yaw_deg: 0.0}   # 1 m from the pier face (x = 0), nose toward it
wall: {point: [0.0, 0.0, 0.0], normal_toward: [1.0, 0.0, 0.0]}
wind_heading_deg: 180.0  # away from the face: the drone in the pier's wake
disturbance:
  mean_speed: 8.0
  num_gusts: 2
  gust_start: [40.0, 65.0]
  gust_duration: [1.0, 2.0]
  gust_speed: [2.0, 4.0]
  turb_sigma: 1.0
  turb_tau: 1.0
  wall_deflect: [0.3, 0.8]
  wall_recirc: [0.2, 0.5]
  wake_ti: [0.1, 0.3]
  shed_amp: [0.2, 0.4]
  shed_width: 1.5                 # the pier is 1.5 m wide
  shed_strouhal: [0.13, 0.2]
hover: {altitude: 2.5, hover_s: 60.0}
