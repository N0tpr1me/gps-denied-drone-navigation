# The hold datasheet's cross-wind cell at 12 m/s (docs/hold-datasheet.md): wall1m_along_10ms
# with more wind. Crashes allowed; they are the result.
name: wall1m_along_12ms
seed: 1
spawn: {x: -1.0, y: 0.0, z: 0.0, yaw_deg: 0.0}   # 1 m from the wall (x = 0), nose toward it
wall: {point: [0.0, 0.0, 0.0], normal_toward: [1.0, 0.0, 0.0]}
wind_heading_deg: 90.0
disturbance:
  mean_speed: 12.0
  num_gusts: 2
  gust_start: [40.0, 65.0]   # both inside the 60 s hover (it starts ~25 s sim time)
  gust_duration: [1.0, 2.0]
  gust_speed: [2.0, 4.0]
  turb_sigma: 1.5
  turb_tau: 1.0
hover: {altitude: 2.5, hover_s: 60.0}
