# wall1m_calm_0ms with a 35 % payload under the x500: 0.723 kg on its 2.064 kg (docs/airframe-sizes.md).
# The T8 baseline scenario: as calm_0ms, 1 m from the wall, 60 s hover.
# Still air: the adapter runs but every applied force is exactly zero (still-air drag is
# subtracted). The control for the wind scenarios.
name: wall1m_calm_0ms_payload35
seed: 1
spawn: {x: -1.0, y: 0.0, z: 0.0, yaw_deg: 0.0}   # 1 m from the wall (x = 0), nose toward it
wall: {point: [0.0, 0.0, 0.0], normal_toward: [1.0, 0.0, 0.0]}
disturbance:
  mean_speed: 0.0
  num_gusts: 0
  turb_sigma: 0.0
hover: {altitude: 2.5, hover_s: 60.0}
payload: {mass_kg: 0.723, offset_down_m: 0.05}
