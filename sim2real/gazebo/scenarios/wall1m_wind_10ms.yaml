# The 8 m/s benchmark scenario at 10 m/s: the first of the datasheet-level wind cells
# (docs/gpu-server-plan.md, "10 to 12 m/s"). 10 m/s mean wind blowing into the wall, 1 m off
# it, gusts to 14 m/s inside the 60 s hover, stronger turbulence. Nothing else changes, so a
# flight here differs from wall1m_wind_8ms only in the wind.
name: wall1m_wind_10ms
seed: 1
spawn: {x: -1.0, y: 0.0, z: 0.0, yaw_deg: 0.0}   # 1 m from the wall (x = 0), nose toward it
wall: {point: [0.0, 0.0, 0.0], normal_toward: [1.0, 0.0, 0.0]}
wind_heading_deg: 0.0
disturbance:
  mean_speed: 10.0
  num_gusts: 2
  gust_start: [40.0, 65.0]   # both inside the 60 s hover (it starts ~25 s sim time)
  gust_duration: [1.0, 2.0]
  gust_speed: [2.0, 4.0]
  turb_sigma: 1.25
  turb_tau: 1.0
hover: {altitude: 2.5, hover_s: 60.0}
