# Field-failure profile (docs/field-faults.md): vio_default's delay, noise and bias walk, its
# random jumps and dropouts off, and one scripted failure 20 s into the scored window
# (sim2real/estimate_bridge/field_faults.py).
# Heavy dust: the field_degrade dust (noisier VIO, a walk, short tracking losses; a noisy
# rangefinder with lost and short returns) from 20 s, and from 25 s the VIO runs away on the
# drifting grains (docs/vio-render.md): its velocity error grows at 0.5 m/s^2 along the wall
# (ENU +y, the axis no guard measures) for 15 s, position and velocity agreeing with each
# other and not with the IMU.
# This copy is for the stock PX4 runner (keyed to the hover height); the _at_engage twin differs only in its anchor.
name: field_runaway_at_hover
seed: 1
fault_anchor: altitude
fault_anchor_alt_m: null   # the stock runner fills it from the scenario
fault_anchor_s: 25.0
bias_from_anchor: true
estimate: {jump_rate_hz: 0.0, dropout_rate_hz: 0.0}
field_faults:
  - {kind: degrade, at_s: 20.0, duration_s: 20.0, ramp_s: 5.0, noise_m: 0.05,
     vel_noise_mps: 0.2, walk_mps: 0.1, loss_hz: 0.25, loss_s: 0.5,
     range_noise_m: 0.05, range_loss_frac: 0.2, range_short_frac: 0.1}
  - {kind: runaway, at_s: 25.0, duration_s: 15.0, accel_mps2: 0.5, direction: [0.0, 1.0, 0.0]}
