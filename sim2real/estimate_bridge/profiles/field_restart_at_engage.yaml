# Field-failure profile (docs/field-faults.md): vio_default's delay, noise and bias walk, its
# random jumps and dropouts off, and one scripted failure 20 s into the scored window
# (sim2real/estimate_bridge/field_faults.py).
# The VIO process dies for 3 s, then comes back with its frame reset to its origin.
# This copy is for the hold runner (keyed to the engage); the _at_hover twin differs only in its anchor.
name: field_restart_at_engage
seed: 1
fault_anchor: engage
fault_anchor_s: 25.0
bias_from_anchor: true
estimate: {jump_rate_hz: 0.0, dropout_rate_hz: 0.0}
field_faults:
  - {kind: restart, at_s: 20.0, duration_s: 3.0}
