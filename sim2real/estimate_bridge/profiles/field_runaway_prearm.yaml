# Field-failure profile (docs/field-faults.md, "Before take-off"): vio_default's delay, noise
# and bias walk, its random jumps and dropouts off, and one scripted failure on the ground
# (sim2real/estimate_bridge/field_faults.py).
# A VIO started in drifting dust (docs/vio-render.md: Basalt took the grains for motion while
# the drone sat on the floor and ran off at up to 2.8 m/s before take-off): from 3 s after
# the bridge's first sample the VIO's velocity error grows at 0.5 m/s^2 along the wall
# (ENU +y) to 2.8 m/s and runs on at it until 45 s, position and velocity agreeing with each
# other; then it is steady again with the offset it gathered, as Basalt was once airborne.
# One profile for both runners: the fault is timed from the bridge's start, before any arming.
name: field_runaway_prearm
seed: 1
fault_anchor: start
estimate: {jump_rate_hz: 0.0, dropout_rate_hz: 0.0}
field_faults:
  - {kind: runaway, at_s: 3.0, duration_s: 42.0, accel_mps2: 0.5, max_speed_mps: 2.8,
     direction: [0.0, 1.0, 0.0]}
