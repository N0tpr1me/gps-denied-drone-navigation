# Field-failure profile (docs/field-faults.md): vio_default's delay, noise and bias walk, its
# random jumps and dropouts off, and one scripted failure 20 s into the scored window
# (sim2real/estimate_bridge/field_faults.py).
# The companion link or VIO stops for 8 s, past the module's 5 s stale trip (SH_WD_EST_TO).
# This copy is for the stock PX4 runner (keyed to the hover height); the _at_engage twin differs only in its anchor.
name: field_silence_at_hover
seed: 1
fault_anchor: altitude
fault_anchor_alt_m: null   # the stock runner fills it from the scenario
fault_anchor_s: 25.0
bias_from_anchor: true
estimate: {jump_rate_hz: 0.0, dropout_rate_hz: 0.0}
field_faults:
  - {kind: silence, at_s: 20.0, duration_s: 8.0}
