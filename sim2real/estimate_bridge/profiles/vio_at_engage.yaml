# vio_default with its jumps and dropouts keyed to the moment Structure Hold first engages
# (bridge.py, "Fault anchor"). Before the engage the same seed's draws run with every fault
# suppressed, so PX4 arms and takes off on a quiet estimate (seed 7 of the Gate 2 batch
# broke both controllers with jumps during arming). At the engage the fault clock is set to
# 25 s, where the seed 1 to 8 batches' holds opened (24.7 to 25.5 s after the first
# sample), so the faults inside the hold are the ones those batches flew, now at the same
# time after engage for every policy and seed. Policy v11's seed 3 strike (docs/baseline.md)
# came from a jump that landed 0.1 to 0.4 s before the scripted disengage for v11 and 1.3 s
# before it for v10: with this profile the two would have met it at the same moment.
name: vio_at_engage
seed: 1
fault_anchor: engage
fault_anchor_s: 25.0
# The bias walk starts at the anchor too: without this the bias each runner met in its
# scored window depended on how long its takeoff took (bridge.py, "Bias from the anchor").
bias_from_anchor: true
