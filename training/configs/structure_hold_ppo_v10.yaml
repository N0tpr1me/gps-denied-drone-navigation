# Policy v10 candidate: v9 (run 20261023-050244, iteration 2500) continued against the slow
# drift v9 showed in Gazebo. In one of its three 8 m/s flights v9 slid about 1 m off the hold
# point over 25 s while seeing the error, then recovered (PR #42). The mock does the same on
# gz_x500_sitl in a steady wind into the wall, and only then: v9 drifts 0.6 m in 60 s at
# 8 m/s into the wall, 0.1 m along it, none away from it; v6 does not drift. Training had
# 20 s episodes with the wind from anywhere, so the drift, which takes 20 to 40 s to grow,
# was rarely seen and cheap. Changes from v9: 60 s episodes, the mean wind always with a
# component into the wall (gusts still from anywhere), and the airframe now with EKF2's
# resets to the fix (envs/estimate/ekf.py). Judged by eval/configs/gazebo_check.yaml.
#   python -m training.launch --config training/configs/structure_hold_ppo_v10.yaml --smoke --device cpu
name: structure_hold_ppo_v10
entrypoint: training.train_ppo
seed: 0
expected_hours: 0.8
gpus: 1
params:
  num_envs: 1024
  resume: runs/20261023-050244_structure_hold_ppo_v9_s0_d046dc1/policy.pt  # v9: iteration 2500
  iterations: 1000  # ~28k env-steps/s on 4 CPU cores: ~30 min plus selection, under the 1 h rule
  num_steps_per_env: 48
  history: 15  # 180 ms window at the 12 ms tick, covers the 50 to 150 ms estimate delay
  sim: torch
  env:
    airframe: gz_x500_sitl
    episode_length_s: 60.0  # the Gazebo benchmark's hover; the drift needs 20 to 40 s to grow
    disturbance:
      mean_heading_deg: [-90.0, 90.0]  # toward +x, into the wall, give or take 90 deg
    reward:
      thrust: 1.0  # times |thrust / weight - 1|, clipped at 1
      ang_vel: 0.1  # times body-rate norm, clipped at 10 rad/s
    # Extra rate-setpoint lag up to 30 ms, drawn per episode, as for v6 (the tick itself is
    # now in the preset).
    rate_lag_s: [0.0, 0.03]
    estimate:
      jump_rate_hz: 0.1
      dropout_rate_hz: 0.1
    # Around the x500: payload and battery (mass), build (inertia), worn or other motors and
    # props (thrust/weight, motor lag), and PX4's hover-thrust estimate off by up to 20 %.
    airframe_rand:
      mass_scale: [0.85, 1.2]
      inertia_scale: [0.75, 1.35]
      thrust_to_weight_scale: [0.9, 1.1]
      motor_tau_s: [0.012, 0.035]
      hover_thrust_error: [-0.2, 0.2]
    wall_yaw_torque:
      peak_nm: [0.0, 0.02]  # a tenth of the x500's 0.19 N m yaw authority
  curriculum:
    dropout_max_s: null
    fraction: 0.6
  eval:
    num_envs: 256
    episodes: 1
    score_envs: 32
    env:
      estimate:
        jump_rate_hz: 0.02
        dropout_rate_hz: 0.02
    select_every: 250
    select_envs: 256
smoke:
  num_envs: 32
  iterations: 3
  num_steps_per_env: 16
  save_interval: 1
  env:
    airframe: gz_x500_sitl
    episode_length_s: 2.0
    disturbance: {mean_heading_deg: [-90.0, 90.0]}
    airframe_rand: {mass_scale: [0.85, 1.2], hover_thrust_error: [-0.2, 0.2]}
  eval:
    num_envs: 8
    episodes: 1
    score_envs: 4
    env: {}
    select_every: 2
    select_envs: 8
