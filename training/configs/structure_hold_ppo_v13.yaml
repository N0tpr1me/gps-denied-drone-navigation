# Policy v13 candidate: v12 (run 20261023-140240) continued with a stronger penalty on error
# toward the wall.
# - v12 lost to v10 in Gazebo on the matched timeline (PR #52) on one seed: after a 1.8 m
#   vision jump along the wall it did not chase the jump, but drifted 0.27 to 0.31 m toward
#   the wall (v10 0.03 to 0.07 m). The mock replays it (eval/configs/gazebo_check.yaml,
#   seed1_jump: v12 0.26 m, v10 0.08 m). In reward terms v12's trade was cheap: the
#   toward-wall term was 0.5 per metre, so 0.27 m toward the wall cost less than chasing
#   0.4 m along it. Here it is 2.0 per metre.
# - Everything else is v12's: up to 60 ms of rate lag (v12 rings less than v10), the x500's
#   0.40 m contact radius, exploration std reset to 0.05.
# - Gate 1's headline through the EKF2-like fusion (8 m/s, 1 m, seed 8001, a scratch
#   diagnostic): v12 -29.5 % against the PD, v10 -16 %; the target is -30 %.
# Judged by eval/configs/gazebo_check.yaml (must beat v10 there, seed1_jump included) before
# any Gazebo re-fly.
#   python -m training.launch --config training/configs/structure_hold_ppo_v13.yaml --smoke --device cpu
name: structure_hold_ppo_v13
entrypoint: training.train_ppo
seed: 0
expected_hours: 0.8
gpus: 1
params:
  num_envs: 1024
  resume: runs/20261023-140240_structure_hold_ppo_v12_s0_113b9c9/policy.pt  # v12
  resume_std: 0.05  # as for v12: PPO's std decays to the 0.01 floor, where it cannot learn
  iterations: 1000  # ~28k env-steps/s on 4 CPU cores: ~30 min plus selection, under the 1 h rule
  num_steps_per_env: 48
  history: 15  # 180 ms window at the 12 ms tick, covers the 50 to 150 ms estimate delay
  sim: torch
  env:
    airframe: gz_x500_sitl
    episode_length_s: 60.0  # the Gazebo benchmark's hover; the drift needs 20 to 40 s to grow
    disturbance:
      mean_heading_deg: [-90.0, 90.0]  # toward +x, into the wall, give or take 90 deg
    reward:
      thrust: 1.0  # times |thrust / weight - 1|, clipped at 1
      ang_vel: 0.1  # times body-rate norm, clipped at 10 rad/s
      pos: 2.0  # times 1 - exp(-error / 0.5 m): 4 per metre near zero (v10: 1.5 over 1 m)
      pos_scale_m: 0.5
      toward_wall: 2.0  # times the error toward the wall clipped at 1 m (v12: 0.5)
    # Extra rate-setpoint lag up to 30 ms, drawn per episode, as for v6 (the tick itself is
    # now in the preset).
    rate_lag_s: [0.0, 0.06]  # as v12 (v11: [0.0, 0.03])
    contact_radius_m: 0.40  # the x500's props (eval/configs/gazebo_check.yaml)
    estimate:
      jump_rate_hz: 0.04  # v10 and stage A: 0.1, five times vio_default's 0.02
      dropout_rate_hz: 0.04
    # Around the x500: payload and battery (mass), build (inertia), worn or other motors and
    # props (thrust/weight, motor lag), and PX4's hover-thrust estimate off by up to 20 %.
    airframe_rand:
      mass_scale: [0.85, 1.2]
      inertia_scale: [0.75, 1.35]
      thrust_to_weight_scale: [0.9, 1.1]
      motor_tau_s: [0.012, 0.035]
      hover_thrust_error: [-0.2, 0.2]
    wall_yaw_torque:
      peak_nm: [0.0, 0.02]  # a tenth of the x500's 0.19 N m yaw authority
  curriculum:
    dropout_max_s: null
    fraction: 0.6
  eval:
    num_envs: 256
    episodes: 1
    score_envs: 32
    env:
      estimate:
        jump_rate_hz: 0.02
        dropout_rate_hz: 0.02
    select_every: 250
    select_envs: 256
smoke:
  num_envs: 32
  iterations: 3
  num_steps_per_env: 16
  save_interval: 1
  env:
    airframe: gz_x500_sitl
    episode_length_s: 2.0
    disturbance: {mean_heading_deg: [-90.0, 90.0]}
    airframe_rand: {mass_scale: [0.85, 1.2], hover_thrust_error: [-0.2, 0.2]}
  eval:
    num_envs: 8
    episodes: 1
    score_envs: 4
    env: {}
    select_every: 2
    select_envs: 8
