# Policy v9 candidate: v6 (run 20261022-223115, iteration 1500) continued on the
# gz_x500_sitl airframe, the mock that reproduces Gazebo (docs/gazebo_check.md): PX4's 2 Hz
# yaw torque filter and 40 Hz gyro filter, the module's 83 Hz tick, the fix 0.24 m below the
# CG, EKF2-like fusion. In Gazebo v6 falls into a 1.6 Hz roll and yaw wobble after an
# estimate jump or dropout and sits 0.2 to 0.4 m high; it does the same on this airframe, so
# here the wobble costs it reward (position error, body rates) where the old mock never
# showed it. One change from v6: the airframe. Judged by eval/configs/gazebo_check.yaml.
#   python -m training.launch --config training/configs/structure_hold_ppo_v9.yaml --smoke --device cpu
name: structure_hold_ppo_v9
entrypoint: training.train_ppo
seed: 0
expected_hours: 0.8
gpus: 1
params:
  num_envs: 1024
  resume: runs/20261022-223115_structure_hold_ppo_v5_resume_s0_ca3b52d/policy.pt  # v6: run 4, iteration 1500
  iterations: 1000  # ~28k env-steps/s on 4 CPU cores: ~30 min plus selection, under the 1 h rule
  num_steps_per_env: 48
  history: 15  # 180 ms window at the 12 ms tick, covers the 50 to 150 ms estimate delay
  sim: torch
  env:
    airframe: gz_x500_sitl
    reward:
      thrust: 1.0  # times |thrust / weight - 1|, clipped at 1
      ang_vel: 0.1  # times body-rate norm, clipped at 10 rad/s
    # Extra rate-setpoint lag up to 30 ms, drawn per episode, as for v6 (the tick itself is
    # now in the preset).
    rate_lag_s: [0.0, 0.03]
    estimate:
      jump_rate_hz: 0.1
      dropout_rate_hz: 0.1
    # Around the x500: payload and battery (mass), build (inertia), worn or other motors and
    # props (thrust/weight, motor lag), and PX4's hover-thrust estimate off by up to 20 %.
    airframe_rand:
      mass_scale: [0.85, 1.2]
      inertia_scale: [0.75, 1.35]
      thrust_to_weight_scale: [0.9, 1.1]
      motor_tau_s: [0.012, 0.035]
      hover_thrust_error: [-0.2, 0.2]
    wall_yaw_torque:
      peak_nm: [0.0, 0.02]  # a tenth of the x500's 0.19 N m yaw authority
  curriculum:
    dropout_max_s: null
    fraction: 0.6
  eval:
    num_envs: 256
    episodes: 1
    score_envs: 32
    env:
      estimate:
        jump_rate_hz: 0.02
        dropout_rate_hz: 0.02
    select_every: 250
    select_envs: 256
smoke:
  num_envs: 32
  iterations: 3
  num_steps_per_env: 16
  save_interval: 1
  env:
    airframe: gz_x500_sitl
    episode_length_s: 2.0
    airframe_rand: {mass_scale: [0.85, 1.2], hover_thrust_error: [-0.2, 0.2]}
  eval:
    num_envs: 8
    episodes: 1
    score_envs: 4
    env: {}
    select_every: 2
    select_envs: 8
