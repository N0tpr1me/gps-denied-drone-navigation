# Route Follow on the mix of worlds (docs/route-follow.md, "Worlds"): v0 (run
# 20261101-174152, corridors and round tunnels only) trained on further through arched
# drifts, narrow pipes, narrowed stretches, side branches and steeper ramps, alongside the
# plain corridors and tunnels. params.resume names v0's policy.pt, which lives only in that
# run folder; on a machine without it, set resume: null to train the mix from scratch.
# Keep each run under 1 h on the cloud CPUs and chain runs with params.resume.
#   python -m training.launch --config training/configs/route_follow_ppo_worlds.yaml --smoke --device cpu
name: route_follow_ppo_worlds
entrypoint: training.train_route_ppo
seed: 1
expected_hours: 0.9
gpus: 1
params:
  num_envs: 1024
  iterations: 1000
  num_steps_per_env: 48
  history: 3
  sim: torch
  save_interval: 50
  resume: runs/20261101-174152_route_follow_ppo_s0_cdbaa61/policy.pt
  env:
    airframe: gz_x500_sitl
    episode_length_s: 30.0
    contact_radius_m: 0.40
    route:
      arch_prob: 0.4  # of the corridors
      pinch_prob: 0.25
      pinch_frac: [0.7, 0.9]
      branches: 2
      branch_prob: 0.5
      climb_deg: [-20.0, 20.0]
      tunnel_radius_m: [0.9, 2.0]
    ranges:
      present_prob: 0.7
      outlier_prob: 0.01
  eval:
    num_envs: 128
    episodes: 1
    env: {}
smoke:
  num_envs: 32
  iterations: 3
  num_steps_per_env: 16
  save_interval: 1
  resume: null
  env:
    airframe: gz_x500_sitl
    episode_length_s: 8.0
    contact_radius_m: 0.40
    route: {arch_prob: 0.4, pinch_prob: 0.25, pinch_frac: [0.7, 0.9], branches: 2,
            branch_prob: 0.5, climb_deg: [-20.0, 20.0], tunnel_radius_m: [0.9, 2.0]}
    ranges: {present_prob: 0.7, outlier_prob: 0.01}
  eval:
    num_envs: 8
    episodes: 1
    env: {}
