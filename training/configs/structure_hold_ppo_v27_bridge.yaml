# Policy v27 candidate, trained only if v22 loses under a bridge (docs/bridge-holds.md,
# queue training/queues/bridge_holds.yaml, jobs bridge_ft_s*: off until that result). v22's
# recipe (structure_hold_ppo_v22.yaml, as structure_hold_ppo_v26_wind.yaml continues it)
# continued from v22's own ONNX in the air under a bridge: a deck 1 to 6 m over every hold
# (beyond about 3 m it is nearly open sky, so the deck-free case stays in), the abutment's
# or pier's near-wall flow on at its eval ranges, any wind heading, vortex shedding from a
# 0.5 to 3 m pier or a 1 to 2 m deep deck. Same inputs (21), reward and airframe
# randomisation as v22, so the released module header could take it unchanged. Fresh critic
# warmed up 200 iterations first. GPU-sized: 4096 drones, 800 iterations plus the warm-up,
# one part under 1 h. Two seeds (the queue's bridge_ft_s0 and bridge_ft_s1), because PPO
# moved more between seeds than between recipes before (v23 to v25).
#   python -m training.launch --config training/configs/structure_hold_ppo_v27_bridge.yaml --smoke --device cpu
#   python -m training.launch --config training/configs/structure_hold_ppo_v27_bridge.yaml --device cuda
name: structure_hold_ppo_v27_bridge
entrypoint: training.train_ppo
seed: 0
expected_hours: 0.9
gpus: 1
params:
  num_envs: 4096
  init_actor_onnx: training/policies/structure_hold_v22.onnx  # released (PR #93)
  critic_warmup: 200
  resume_std: 0.05
  iterations: 800
  num_obs: 21
  num_steps_per_env: 48
  history: 15
  sim: torch
  env:
    airframe: gz_x500_sitl
    episode_length_s: 60.0
    reengage_rate_hz: 0.05
    deck_clearance: [1.0, 6.0]
    disturbance:
      wall_deflect: [0.0, 0.8]
      wall_recirc: [0.0, 0.5]
      wake_ti: [0.0, 0.3]
      shed_amp: [0.0, 0.4]
      shed_width: [0.5, 3.0]
      shed_strouhal: [0.1, 0.21]
      surface2_shed_amp: [0.0, 0.4]
      surface2_shed_width: [1.0, 2.0]
      surface2_shed_strouhal: [0.1, 0.15]
    reward:
      thrust: 1.0
      ang_vel: 0.2
      pos: 2.0
      pos_scale_m: 0.5
      toward_wall: 2.0
      height: 0.5
      height_scale_m: 0.1
      action_band: 5.0
    rate_lag_s: [0.0, 0.06]
    contact_radius_m: 0.40
    estimate:
      jump_rate_hz: 0.1
      dropout_rate_hz: 0.1
    airframe_rand:
      mass_scale: [0.85, 1.2]
      inertia_scale: [0.75, 1.35]
      thrust_to_weight_scale: [0.9, 1.1]
      motor_tau_s: [0.012, 0.035]
      hover_thrust_error: [-0.2, 0.2]
    wall_yaw_torque:
      peak_nm: [0.0, 0.02]
  curriculum:
    dropout_max_s: null
    fraction: 0.6
  eval:
    num_envs: 256
    episodes: 1
    score_envs: 32
    env:
      reengage_rate_hz: 0.0
      deck_clearance: 1.5  # the deck corner, the hard bridge cell
      hold_distance: 1.0
      disturbance: {mean_speed: 8.0, mean_heading_deg: 45.0, wall_deflect: [0.3, 0.8],
                    wall_recirc: [0.2, 0.5], wake_ti: [0.1, 0.3], shed_amp: [0.1, 0.4],
                    surface2_shed_amp: [0.1, 0.4], surface2_shed_width: 1.0}
      estimate:
        jump_rate_hz: 0.02
        dropout_rate_hz: 0.02
    select_every: 200
    select_envs: 256
smoke:
  critic_warmup: 2
  num_obs: 21
  num_envs: 32
  iterations: 3
  num_steps_per_env: 16
  save_interval: 1
  env:
    airframe: gz_x500_sitl
    episode_length_s: 2.0
    reengage_rate_hz: 2.0
    reengage_min_s: 0.5
    deck_clearance: [1.0, 6.0]
    disturbance: {wake_ti: [0.0, 0.3], shed_amp: [0.0, 0.4], surface2_shed_amp: [0.0, 0.4]}
    airframe_rand: {mass_scale: [0.85, 1.2], hover_thrust_error: [-0.2, 0.2]}
  eval:
    num_envs: 8
    episodes: 1
    score_envs: 4
    env: {deck_clearance: 1.5}
    select_every: 2
    select_envs: 8
