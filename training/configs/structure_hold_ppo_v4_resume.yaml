# Policy v4 candidate: the v3 recipe plus domain randomisation over what broke v3 in the
# Gate 1 stress set (eval/configs/gate1_stress.yaml, docs/gate1.md): estimate delay beyond
# 150 ms, airframe inertia, motor lag and hover-thrust error. History 25 steps (250 ms) so
# the actor's window covers the whole delay range (the v2 lesson: a window shorter than the
# delay cannot identify it). Same reward, same PX4-like rate dynamics as v3.
#   python -m training.launch --config training/configs/structure_hold_ppo_v4.yaml --smoke --device cpu
# Three ~50 min runs of 1000 iterations chained with structure_hold_ppo_v4_resume.yaml
# (3000 iterations; 1500 per run would take ~75 min, over the 1 h rule).
name: structure_hold_ppo_v4_resume
entrypoint: training.train_ppo
seed: 0
expected_hours: 0.9
gpus: 1
params:
  num_envs: 1024
  # Continue the first v4 run for 1500 more; point this at it before launching.
  resume: runs/20261022-180126_structure_hold_ppo_v4_resume_s0_5351992/tb/model_1999.pt
  iterations: 1000  # ~19.5k env-steps/s on 4 CPU cores with the 25-step history: ~50 min
  num_steps_per_env: 48
  history: 25  # 250 ms: covers the 50 to 250 ms delay drawn below
  sim: torch
  env:
    # 5x the standard jump and dropout rates (as v3), the delay up to 250 ms.
    estimate:
      jump_rate_hz: 0.1
      dropout_rate_hz: 0.1
      delay_min_s: 0.05
      delay_max_s: 0.25
    # One airframe per episode over the Gate 1 stress envelope.
    airframe_rand:
      mass_scale: [0.7, 1.5]
      inertia_scale: [0.5, 2.0]
      thrust_to_weight_scale: [0.75, 1.0]
      motor_tau_s: [0.02, 0.08]
      hover_thrust_error: [-0.15, 0.15]
    wall_yaw_torque:
      peak_nm: [0.0, 0.025]
  curriculum:
    dropout_max_s: null
    fraction: 0.6
  eval:
    num_envs: 256
    episodes: 1
    score_envs: 32
    env:
      estimate:
        jump_rate_hz: 0.02
        dropout_rate_hz: 0.02
    select_every: 250
    select_envs: 256
smoke:
  num_envs: 32
  iterations: 3
  num_steps_per_env: 16
  save_interval: 1
  env:
    episode_length_s: 2.0
    airframe_rand: {mass_scale: [0.7, 1.5], inertia_scale: [0.5, 2.0]}
  eval:
    num_envs: 8
    episodes: 1
    score_envs: 4
    env: {}
    select_every: 2
    select_envs: 8
