# Policy v26 candidate, trained only if v22 loses to tuned PX4 at 10 or 12 m/s in Gazebo
# (docs/gpu-server-plan.md, job "hold_wind_finetune", off until that result). v22's recipe
# (training/configs/structure_hold_ppo_v22.yaml) continued from v22's own ONNX with the mean
# wind drawn from 6 to 12 m/s instead of 0 to 12 and blowing within 60 degrees of straight
# into the wall, so a quarter of its episodes no longer sit in calm air. Everything else is
# v22's: same inputs (21), same reward, same airframe randomisation, so the released module
# header could take it unchanged. Fresh critic warmed up 200 iterations first.
# GPU-sized: 4096 drones, 800 iterations plus the warm-up, one part, under 1 h on the GPU
# (the v22 run took 25 min for 1000 iterations with 1024 drones on 4 CPU cores).
#   python -m training.launch --config training/configs/structure_hold_ppo_v26_wind.yaml --smoke --device cpu
#   python -m training.launch --config training/configs/structure_hold_ppo_v26_wind.yaml --device cuda
name: structure_hold_ppo_v26_wind
entrypoint: training.train_ppo
seed: 0
expected_hours: 0.9
gpus: 1
params:
  num_envs: 4096
  init_actor_onnx: training/policies/structure_hold_v22.onnx  # released (PR #93)
  critic_warmup: 200
  resume_std: 0.05
  iterations: 800
  num_obs: 21
  num_steps_per_env: 48
  history: 15
  sim: torch
  env:
    airframe: gz_x500_sitl
    episode_length_s: 60.0
    reengage_rate_hz: 0.05
    disturbance:
      mean_speed: [6.0, 12.0]  # v22: [0, 12]; the datasheet winds, no calm episodes
      mean_heading_deg: [-60.0, 60.0]  # v22: +/-90; more of it straight into the wall
      gust_speed: [2.0, 4.0]
      turb_sigma: 1.5  # as wall1m_wind_12ms
    reward:
      thrust: 1.0
      ang_vel: 0.2
      pos: 2.0
      pos_scale_m: 0.5
      toward_wall: 2.0
      height: 0.5
      height_scale_m: 0.1
      action_band: 5.0
    rate_lag_s: [0.0, 0.06]
    contact_radius_m: 0.40
    estimate:
      jump_rate_hz: 0.1
      dropout_rate_hz: 0.1
    airframe_rand:
      mass_scale: [0.85, 1.2]
      inertia_scale: [0.75, 1.35]
      thrust_to_weight_scale: [0.9, 1.1]
      motor_tau_s: [0.012, 0.035]
      hover_thrust_error: [-0.2, 0.2]
    wall_yaw_torque:
      peak_nm: [0.0, 0.02]
  curriculum:
    dropout_max_s: null
    fraction: 0.6
  eval:
    num_envs: 256
    episodes: 1
    score_envs: 32
    env:
      reengage_rate_hz: 0.0
      disturbance: {mean_speed: [8.0, 12.0], mean_heading_deg: 0.0}  # into the wall, hard
      estimate:
        jump_rate_hz: 0.02
        dropout_rate_hz: 0.02
    select_every: 200
    select_envs: 256
smoke:
  critic_warmup: 2
  num_obs: 21
  num_envs: 32
  iterations: 3
  num_steps_per_env: 16
  save_interval: 1
  env:
    airframe: gz_x500_sitl
    episode_length_s: 2.0
    reengage_rate_hz: 2.0
    reengage_min_s: 0.5
    disturbance: {mean_speed: [6.0, 12.0], mean_heading_deg: [-60.0, 60.0]}
    airframe_rand: {mass_scale: [0.85, 1.2], hover_thrust_error: [-0.2, 0.2]}
  eval:
    num_envs: 8
    episodes: 1
    score_envs: 4
    env: {}
    select_every: 2
    select_envs: 8
