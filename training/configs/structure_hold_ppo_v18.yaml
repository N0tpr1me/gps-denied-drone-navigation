# Policy v18 candidate: v17 (run 20261023-211755) continued with the toward-the-wall penalty
# back at 2.0 per metre (4.0 in v16 and v17) and twice the body-rate penalty.
# - v17 fixed seed 1's drift (0.04 m toward the wall in the replay, v10 0.08 m), beats v10 in
#   every rough cell of the Gazebo-like check and is -37 % against the PD on Gate 1's headline
#   (scratch seed 8001). It fails two of the check's rules (run 20261023-215357):
#   - on a clean estimate it stands 0.05 m off the hold point, away from the wall (calm clean
#     p95 0.062 m against the 0.058 m limit): with a one-sided penalty at 4.0 and five times
#     the eval rate of jumps, standing back is what the reward pays for. The jumps at 0.1 Hz
#     are what stopped the drift (v16 had the 4.0 penalty and still drifted 0.19 m; v10,
#     trained with 0.1 Hz jumps and a 0.5 penalty, does not drift), so the penalty goes back
#     to v13's 2.0 and the jumps stay;
#   - it rings 13 % more than v10 (1.2 to 2.2 Hz roll, 5 % allowed). The ring came with the
#     re-engages (v13 0.0055, v14 0.0155 on a scratch probe), which made the policy act
#     harder on an offset; the body-rate penalty goes from 0.1 to 0.2 to damp it.
# - Everything else is v17's.
# Judged by the seed 1 replay, the clean offset, Gate 1's headline on a scratch seed, then
# eval/configs/gazebo_check.yaml.
#   python -m training.launch --config training/configs/structure_hold_ppo_v18.yaml --smoke --device cpu
name: structure_hold_ppo_v18
entrypoint: training.train_ppo
seed: 0
expected_hours: 0.8
gpus: 1
params:
  num_envs: 1024
  resume: runs/20261023-211755_structure_hold_ppo_v17_s0_71cd5bd/policy.pt  # v17
  resume_std: 0.05  # as for v12 to v17: PPO's std decays to the 0.01 floor, where it cannot learn
  iterations: 1000  # ~28k env-steps/s on 4 CPU cores: ~30 min plus selection, under the 1 h rule
  num_steps_per_env: 48
  history: 15  # 180 ms window at the 12 ms tick, covers the 50 to 150 ms estimate delay
  sim: torch
  env:
    airframe: gz_x500_sitl
    episode_length_s: 60.0  # the Gazebo benchmark's hover; the drift needs 20 to 40 s to grow
    reengage_rate_hz: 0.05  # a fresh 0.2 m offset about every 20 s, none in the first 2 s
    disturbance:
      mean_heading_deg: [-90.0, 90.0]  # toward +x, into the wall, give or take 90 deg
    reward:
      thrust: 1.0  # times |thrust / weight - 1|, clipped at 1
      ang_vel: 0.2  # times body-rate norm, clipped at 10 rad/s (v12 to v17: 0.1), against the ring
      pos: 2.0  # times 1 - exp(-error / 0.5 m): 4 per metre near zero (v10: 1.5 over 1 m)
      pos_scale_m: 0.5
      toward_wall: 2.0  # times the error toward the wall clipped at 1 m (v13 to v15; v16, v17: 4.0)
      height: 0.5  # times 1 - exp(-|height error| / 0.1 m), for the clean-estimate sag (v15)
      height_scale_m: 0.1
    # Extra rate-setpoint lag up to 30 ms, drawn per episode, as for v6 (the tick itself is
    # now in the preset).
    rate_lag_s: [0.0, 0.06]  # as v12 (v11: [0.0, 0.03])
    contact_radius_m: 0.40  # the x500's props (eval/configs/gazebo_check.yaml)
    estimate:
      jump_rate_hz: 0.1  # five times vio_default's 0.02, as for v10 and v17 (v11 to v16: 0.04)
      dropout_rate_hz: 0.1
    # Around the x500: payload and battery (mass), build (inertia), worn or other motors and
    # props (thrust/weight, motor lag), and PX4's hover-thrust estimate off by up to 20 %.
    airframe_rand:
      mass_scale: [0.85, 1.2]
      inertia_scale: [0.75, 1.35]
      thrust_to_weight_scale: [0.9, 1.1]
      motor_tau_s: [0.012, 0.035]
      hover_thrust_error: [-0.2, 0.2]
    wall_yaw_torque:
      peak_nm: [0.0, 0.02]  # a tenth of the x500's 0.19 N m yaw authority
  curriculum:
    dropout_max_s: null
    fraction: 0.6
  eval:
    num_envs: 256
    episodes: 1
    score_envs: 32
    env:
      reengage_rate_hz: 0.0  # selection scores the hold as Gate 1 and Gazebo fly it
      estimate:
        jump_rate_hz: 0.02
        dropout_rate_hz: 0.02
    select_every: 250
    select_envs: 256
smoke:
  num_envs: 32
  iterations: 3
  num_steps_per_env: 16
  save_interval: 1
  env:
    airframe: gz_x500_sitl
    episode_length_s: 2.0
    reengage_rate_hz: 2.0  # a few in the 2 s smoke episodes
    reengage_min_s: 0.5
    disturbance: {mean_heading_deg: [-90.0, 90.0]}
    airframe_rand: {mass_scale: [0.85, 1.2], hover_thrust_error: [-0.2, 0.2]}
  eval:
    num_envs: 8
    episodes: 1
    score_envs: 4
    env: {}
    select_every: 2
    select_envs: 8
