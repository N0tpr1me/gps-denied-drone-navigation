# Policy v19 candidate: v18 (run 20261023-232144) continued with a penalty on the 1 to 6 Hz
# part of its rate commands (reward.action_band).
# - v18 passed every rule of the Gazebo-like check (run 20261024-000518) and flew in Gazebo
#   (PR #58): mean hold p95 -9 to -12 % against v10, but lower on seed 1 only, and it rang at
#   3.3 to 3.4 Hz in all 9 flights, commanded: roll and pitch rate setpoint 2.2 to 5 Hz rms
#   0.118 / 0.113 rad/s against v10's 0.020 / 0.023. The mock shows the same ring (0.113 /
#   0.124 at 3.33 Hz, v10 0.013 / 0.016); the check's 1.2 to 2.2 Hz ring rule did not see it.
#   It began with v16 (toward-the-wall 4.0); v18's body-rate penalty at 0.2 kept it.
# - action_band 5.0: v18's band power (sum over the rate axes of the squared 1 to 6 Hz part,
#   normalised actions) averages about 0.045 on the check's 4 m/s cell, so the term costs it
#   about 0.22 a step; v10's 0.0035 costs 0.02.
# - Everything else is v18's.
# Judged by eval/configs/gazebo_check.yaml with the fast-ring rule (2.2 to 6 Hz).
#   python -m training.launch --config training/configs/structure_hold_ppo_v19.yaml --smoke --device cpu
name: structure_hold_ppo_v19
entrypoint: training.train_ppo
seed: 0
expected_hours: 0.8
gpus: 1
params:
  num_envs: 1024
  resume: runs/20261023-232144_structure_hold_ppo_v18_s0_6faf0cf/policy.pt  # v18
  resume_std: 0.05  # as for v12 to v18: PPO's std decays to the 0.01 floor, where it cannot learn
  iterations: 1000  # ~28k env-steps/s on 4 CPU cores: ~30 min plus selection, under the 1 h rule
  num_steps_per_env: 48
  history: 15  # 180 ms window at the 12 ms tick, covers the 50 to 150 ms estimate delay
  sim: torch
  env:
    airframe: gz_x500_sitl
    episode_length_s: 60.0  # the Gazebo benchmark's hover; the drift needs 20 to 40 s to grow
    reengage_rate_hz: 0.05  # a fresh 0.2 m offset about every 20 s, none in the first 2 s
    disturbance:
      mean_heading_deg: [-90.0, 90.0]  # toward +x, into the wall, give or take 90 deg
    reward:
      thrust: 1.0  # times |thrust / weight - 1|, clipped at 1
      ang_vel: 0.2  # times body-rate norm, clipped at 10 rad/s (v12 to v17: 0.1), against the ring
      pos: 2.0  # times 1 - exp(-error / 0.5 m): 4 per metre near zero (v10: 1.5 over 1 m)
      pos_scale_m: 0.5
      toward_wall: 2.0  # times the error toward the wall clipped at 1 m (v13 to v15; v16, v17: 4.0)
      height: 0.5  # times 1 - exp(-|height error| / 0.1 m), for the clean-estimate sag (v15)
      height_scale_m: 0.1
      action_band: 5.0  # times the 1 to 6 Hz rate-command power, clipped at 0.2: v18's 3.3 Hz ring
    # Extra rate-setpoint lag up to 30 ms, drawn per episode, as for v6 (the tick itself is
    # now in the preset).
    rate_lag_s: [0.0, 0.06]  # as v12 (v11: [0.0, 0.03])
    contact_radius_m: 0.40  # the x500's props (eval/configs/gazebo_check.yaml)
    estimate:
      jump_rate_hz: 0.1  # five times vio_default's 0.02, as for v10 and v17 (v11 to v16: 0.04)
      dropout_rate_hz: 0.1
    # Around the x500: payload and battery (mass), build (inertia), worn or other motors and
    # props (thrust/weight, motor lag), and PX4's hover-thrust estimate off by up to 20 %.
    airframe_rand:
      mass_scale: [0.85, 1.2]
      inertia_scale: [0.75, 1.35]
      thrust_to_weight_scale: [0.9, 1.1]
      motor_tau_s: [0.012, 0.035]
      hover_thrust_error: [-0.2, 0.2]
    wall_yaw_torque:
      peak_nm: [0.0, 0.02]  # a tenth of the x500's 0.19 N m yaw authority
  curriculum:
    dropout_max_s: null
    fraction: 0.6
  eval:
    num_envs: 256
    episodes: 1
    score_envs: 32
    env:
      reengage_rate_hz: 0.0  # selection scores the hold as Gate 1 and Gazebo fly it
      estimate:
        jump_rate_hz: 0.02
        dropout_rate_hz: 0.02
    select_every: 250
    select_envs: 256
smoke:
  num_envs: 32
  iterations: 3
  num_steps_per_env: 16
  save_interval: 1
  env:
    airframe: gz_x500_sitl
    episode_length_s: 2.0
    reengage_rate_hz: 2.0  # a few in the 2 s smoke episodes
    reengage_min_s: 0.5
    disturbance: {mean_heading_deg: [-90.0, 90.0]}
    airframe_rand: {mass_scale: [0.85, 1.2], hover_thrust_error: [-0.2, 0.2]}
  eval:
    num_envs: 8
    episodes: 1
    score_envs: 4
    env: {}
    select_every: 2
    select_envs: 8
