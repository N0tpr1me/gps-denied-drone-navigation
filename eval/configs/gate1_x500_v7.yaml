# Gate 1 x500 test set (gate1_x500.yaml) for the v7 candidate: v6 continued for 1000
# iterations with sensor noise (structure_hold_ppo_v7.yaml, run 20261022-235421, iteration
# 2500). The test set has no sensor noise. Same seeds, cells and rules; v6 and the PD were
# scored on these episodes in run 20261022-231539, v5 and v3 in run 20261022-214627.
#   python -m training.launch --config eval/configs/gate1_x500_v7.yaml --device cpu
name: gate1_x500_v7
entrypoint: eval.gate1
seed: 9001  # unused: the protocol seeds are params.seeds
expected_hours: 0.6  # two controllers, ~30 min on 4 CPU cores
gpus: 1
params:
  controllers:
    - name: v7
      policy: runs/20261022-235421_structure_hold_ppo_v7_s0_2c2b5d8/policy.onnx  # candidate, iteration 2500
  gate_controller: v7
  seeds: [9001, 9002, 9003]  # held out: eval.gate1.RESERVED_SEEDS, refused by training
  num_envs: 1024
  bootstrap: 2000
  base_env:
    airframe: gz_x500
    # The standard estimate corruption (eval rates, not the 5x training rates), stated in
    # full so a later change of a default cannot silently move the test set.
    estimate:
      delay_min_s: 0.05
      delay_max_s: 0.15
      pos_noise_std_m: 0.02
      vel_noise_std_mps: 0.05
      bias_walk_std_m_per_sqrt_s: 0.01
      bias_max_m: 0.3
      jump_rate_hz: 0.02
      jump_min_m: 0.1
      jump_max_m: 2.0
      jump_decay_s: 5.0
      dropout_rate_hz: 0.02
      dropout_min_s: 0.2
      dropout_max_s: 3.0
      dropout_mode: dead_reckon
      dropout_accel_bias_mps2: 0.3
    disturbance:
      # Held-out gust schedule: both gusts start inside the 20 s episode (training draws
      # starts up to 50 s). Gust speed and length stay inside the training ranges.
      num_gusts: 2
      gust_start: [2.0, 16.0]
      gust_duration: [0.5, 3.0]
      gust_speed: [2.0, 5.0]
      turb_sigma: [0.0, 1.5]
  rules:
    p95_headline_reduction: 0.30
    max_pooled_crash_rate: 0.05
  cells:
    - {name: w0_d1, label: "0 m/s, 1 m", env: {disturbance: {mean_speed: 0.0}, hold_distance: 1.0}}
    - {name: w0_d2, label: "0 m/s, 2 m", env: {disturbance: {mean_speed: 0.0}, hold_distance: 2.0}}
    - {name: w4_d1, label: "4 m/s, 1 m", env: {disturbance: {mean_speed: 4.0}, hold_distance: 1.0}}
    - {name: w4_d2, label: "4 m/s, 2 m", env: {disturbance: {mean_speed: 4.0}, hold_distance: 2.0}}
    - {name: w8_d1, label: "8 m/s, 1 m", headline: true, env: {disturbance: {mean_speed: 8.0}, hold_distance: 1.0}}
    - {name: w8_d2, label: "8 m/s, 2 m", env: {disturbance: {mean_speed: 8.0}, hold_distance: 2.0}}
smoke:
  num_envs: 6
  bootstrap: 50
  seeds: [9001]
  base_env:
    airframe: gz_x500
    episode_length_s: 2.0
