    - {name: along_w14_d3_dropout3, label: "14 m/s along the wall, 3 m, 2 to 3 s dropouts about every 20 s", envelope: false, env: {disturbance: {mean_speed: 14.0, turb_sigma: 1.75}, hold_distance: 3.0, estimate: {dropout_rate_hz: 0.05, dropout_min_s: 2.0, dropout_max_s: 3.0}}}
smoke:
  num_envs: 4
  bootstrap: 50
  seeds: [7201]
  base_env:
    airframe: gz_x500_sitl
    episode_length_s: 2.0
    hold_height: 2.4
    contact_radius_m: 0.40
  cells:
    - {name: along_w08_d1_vio, label: "8 m/s along the wall, 1 m, vio_default", env: {disturbance: {mean_speed: 8.0, turb_sigma: 1.0}, hold_distance: 1.0}}
