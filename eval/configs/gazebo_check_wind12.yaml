# The Gazebo-like check at datasheet winds: v22 (released) and v24 (the rangefinder
# candidate) at 8, 10 and 12 m/s blowing into the wall, before the Gazebo flights on the same
# cells (sim2real/gazebo/scenarios/wall1m_wind_1{0,2}ms.yaml; docs/gpu-server-plan.md, job
# "hold_wind_check"). v22 is the reference, so this is a pass/fail for v24 at high wind and a
# table for v22; the Gazebo rows for 10 and 12 m/s (flown 2026-11-09) are in docs/baseline.md,
# "10 and 12 m/s wind into the wall". The
# rangefinder is on every episode (base_env.range), as `run_gazebo --rangefinder` flies it;
# v22 does not read it. Otherwise eval/configs/gazebo_check_v24_range.yaml.
#   python -m training.launch --config eval/configs/gazebo_check_wind12.yaml --smoke --device cpu
#   python -m training.launch --config eval/configs/gazebo_check_wind12.yaml --device cuda
name: gazebo_check_wind12
entrypoint: eval.gazebo_check
seed: 7001  # unused: the check's seeds are params.seeds
expected_hours: 0.5  # two controllers, five hold cells, no re-engage cells
gpus: 1
params:
  controllers:
    - name: v22
      policy: training/policies/structure_hold_v22.onnx
    - name: v24
      policy: training/policies/structure_hold_v24.onnx  # candidate
  reference: v22
  seeds: [7001, 7002]  # outside the Gate 1 held-out block (9000-9999)
  num_envs: 64
  window_s: 40.0
  wobble_threshold: 0.1
  bootstrap: 2000
  rules:
    max_crash_increase: 0.01
    clean_p95_slack_m: 0.02
    toward_wall_slack_m: 0.05
    fast_ring_slack: 0.25
  base_env:
    airframe: gz_x500_sitl
    contact_radius_m: 0.40
    episode_length_s: 60.0
    hold_distance: 1.0
    hold_height: 2.4
    start_offset_std_m: 0.0
    start_yaw_std_rad: 0.0
    range: {present_prob: 1.0}  # a forward rangefinder on every flight
    estimate:
      delay_min_s: 0.05
      delay_max_s: 0.15
      pos_noise_std_m: 0.02
      vel_noise_std_mps: 0.05
      bias_walk_std_m_per_sqrt_s: 0.01
      bias_max_m: 0.3
      jump_rate_hz: 0.02
      jump_min_m: 0.1
      jump_max_m: 2.0
      jump_decay_s: 5.0
      dropout_rate_hz: 0.02
      dropout_min_s: 0.2
      dropout_max_s: 3.0
      dropout_mode: dead_reckon
      dropout_accel_bias_mps2: 0.3
    disturbance:
      num_gusts: 2
      gust_start: [15.0, 40.0]
      gust_duration: [1.0, 2.0]
      turb_tau: 1.0
  cells:
    - name: calm_clean
      label: "calm, clean estimate"
      rough: false
      env:
        estimate: {delay_min_s: 0.0, delay_max_s: 0.0, pos_noise_std_m: 0.0,
                   vel_noise_std_mps: 0.0, bias_walk_std_m_per_sqrt_s: 0.0, bias_max_m: 0.0,
                   jump_rate_hz: 0.0, dropout_rate_hz: 0.0}
        disturbance: {mean_speed: 0.0, num_gusts: 0, turb_sigma: 0.0}
    - name: wind8_wall
      label: "8 m/s into the wall, vio_default"
      env: {disturbance: {mean_speed: 8.0, mean_heading_deg: 0.0, gust_speed: [2.0, 4.0],
                          turb_sigma: 1.0}}
    - name: wind10_wall
      label: "10 m/s into the wall, vio_default (wall1m_wind_10ms)"
      env: {disturbance: {mean_speed: 10.0, mean_heading_deg: 0.0, gust_speed: [2.0, 4.0],
                          turb_sigma: 1.25}}
    - name: wind12_wall
      label: "12 m/s into the wall, vio_default (wall1m_wind_12ms)"
      env: {disturbance: {mean_speed: 12.0, mean_heading_deg: 0.0, gust_speed: [2.0, 4.0],
                          turb_sigma: 1.5}}
    - name: wind12_wall_flow
      label: "12 m/s into the wall with the near-wall flow terms on (docs/near-wall-flow.md)"
      env: {disturbance: {mean_speed: 12.0, mean_heading_deg: 0.0, gust_speed: [2.0, 4.0],
                          turb_sigma: 1.5, wall_deflect: [0.3, 0.8], wall_recirc: [0.2, 0.5],
                          wake_ti: [0.1, 0.3], shed_amp: [0.1, 0.4]}}
  gazebo_baseline: "tuned PX4 on barometer height (docs/baseline.md, EKF2_HGT_REF 0, re-flown 2026-11-09): mean p95 0.33 m at 0 to 8 m/s, 0.33 and 0.34 m at 10 and 12 m/s, scored like for like (0.49 to 0.53 m against the setpoint as logged)"
  gazebo: {}
smoke:
  num_envs: 4
  bootstrap: 50
  seeds: [7001]
  window_s: 1.0
  base_env:  # replaces base_env whole (launch merges the smoke block one level deep)
    airframe: gz_x500_sitl
    range: {present_prob: 1.0}
    episode_length_s: 2.0
    hold_distance: 1.0
    hold_height: 2.4
    contact_radius_m: 0.40
    start_offset_std_m: 0.0
    start_yaw_std_rad: 0.0
