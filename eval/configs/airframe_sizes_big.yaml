# Bring your own drone, the bigger ones (docs/airframe-sizes.md): eval/configs/airframe_sizes.yaml
# with a 3 kg and a 16 kg quad in place of the x500 and the 300 g class. Same controllers,
# seeds, wind, estimate and rangefinder, flown through the same PX4 pieces:
#   - a 3 kg quad (mid_3kg: Holybro X650, 650 mm, thrust/weight 3.0), and the same drone at
#     its 6.3 kg take-off limit (hover at 0.81, PX4's hover estimate at its 0.8 cap);
#   - a 16 kg heavy lifter (heavy_16kg: the Freefly Alta X's airframe, 1415 mm, 33 inch props,
#     thrust/weight 4.3), and the Alta X at its 35.5 kg maximum. Freefly publishes no rotor
#     lag and the hold turns on it, so the 16 kg drone is scored at 40, 60 and 120 ms (the
#     preset's assumption), each with the rate loop a tune would give it
#     (airframe_rand.rate_loop_follows_lag; envs/structure_hold/airframes.py).
# The cascaded PD keeps its x500 hand gains on every airframe: on slow rotors it is a loose
# yardstick, not a tuned controller.
#   python -m training.launch --config eval/configs/airframe_sizes_big.yaml --smoke --device cpu
#   python -m training.launch --config eval/configs/airframe_sizes_big.yaml --device cpu
name: airframe_sizes_big
entrypoint: eval.gate1
seed: 7101  # unused: the seeds are params.seeds
expected_hours: 0.6  # 6 cells x 3 seeds, 100 s each for v22, v24 and the PD on 4 CPU cores
gpus: 1
params:
  controllers:
    - name: v22
      policy: training/policies/structure_hold_v22.onnx  # released
    - name: v24
      policy: training/policies/structure_hold_v24.onnx  # wall-range input, release decided
  gate_controller: v22
  seeds: [7101, 7102, 7103]  # outside the Gate 1 held-out block (9000-9999)
  num_envs: 512
  bootstrap: 2000
  base_env:
    airframe: mid_3kg
    contact_radius_m: 0.52  # 0.325 m arms + 0.19 m props
    hold_distance: [1.0, 2.0]
    range: {present_prob: 1.0, rate_hz: 20.0, noise_std_m: 0.01, noise_frac: 0.005,
            scale_error: [-0.02, 0.02], outlier_prob: 0.01, dropout_rate_hz: 0.05,
            dropout_s: [0.2, 2.0]}
    # The standard estimate corruption (eval rates), stated in full as in Gate 1.
    estimate:
      delay_min_s: 0.05
      delay_max_s: 0.15
      pos_noise_std_m: 0.02
      vel_noise_std_mps: 0.05
      bias_walk_std_m_per_sqrt_s: 0.01
      bias_max_m: 0.3
      jump_rate_hz: 0.02
      jump_min_m: 0.1
      jump_max_m: 2.0
      jump_decay_s: 5.0
      dropout_rate_hz: 0.02
      dropout_min_s: 0.2
      dropout_max_s: 3.0
      dropout_mode: dead_reckon
      dropout_accel_bias_mps2: 0.3
    disturbance:
      # Gate 1's held-out gust schedule; k_quad is left to the airframe (scaled to its
      # frontal area).
      num_gusts: 2
      gust_start: [2.0, 16.0]
      gust_duration: [0.5, 3.0]
      gust_speed: [2.0, 5.0]
      turb_sigma: [0.0, 1.5]
      mean_speed: [0.0, 8.0]
  rules:
    p95_headline_reduction: 0.30
    max_pooled_crash_rate: 0.10
  cells:
    # Contact radius: half the diagonal plus a prop radius. The 16 kg airframe is 2.3 m across
    # its props, so it holds at 2 to 3 m.
    - name: mid_3kg
      label: "3 kg class, 0-8 m/s"
      headline: true
      env: {}
    - name: mid_3kg_max
      label: "3 kg class at its 6.3 kg take-off limit, 0-8 m/s (hover at 0.81)"
      env: {airframe_rand: {mass_scale: 2.1, thrust_to_weight_scale: 0.4762, inertia_scale: 1.3,
                            hover_thrust_error: -0.01}}
    - name: heavy_16kg_lag40
      label: "16 kg, rotor lag 40 ms, 0-8 m/s"
      env: {airframe: heavy_16kg, contact_radius_m: 1.13, hold_distance: [2.0, 3.0],
            airframe_rand: {motor_tau_s: 0.04, rate_loop_follows_lag: true}}
    - name: heavy_35kg_lag40
      label: "Alta X at its 35.5 kg maximum, rotor lag 40 ms, 0-8 m/s"
      env: {airframe: heavy_16kg, contact_radius_m: 1.13, hold_distance: [2.0, 3.0],
            airframe_rand: {mass_scale: 2.219, thrust_to_weight_scale: 0.4507, inertia_scale: 1.3,
                            motor_tau_s: 0.04, rate_loop_follows_lag: true}}
    - name: heavy_16kg_lag60
      label: "16 kg, rotor lag 60 ms, 0-8 m/s"
      envelope: false
      env: {airframe: heavy_16kg, contact_radius_m: 1.13, hold_distance: [2.0, 3.0],
            airframe_rand: {motor_tau_s: 0.06, rate_loop_follows_lag: true}}
    - name: heavy_16kg
      label: "16 kg, rotor lag 120 ms (the preset), 0-8 m/s"
      envelope: false
      env: {airframe: heavy_16kg, contact_radius_m: 1.13, hold_distance: [2.0, 3.0]}
smoke:
  num_envs: 6
  bootstrap: 50
  seeds: [7101]
  base_env:
    airframe: mid_3kg
    episode_length_s: 2.0
