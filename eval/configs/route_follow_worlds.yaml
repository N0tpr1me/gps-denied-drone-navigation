# Route Follow on the other worlds (docs/route-follow.md, "Worlds"): arched mine drifts,
# narrow pipes, narrowed stretches, side branches, steep ramps, and a mix of all of them,
# against the classical yardsticks (PD on the estimate, PD with range centring), on the x500
# as SITL flies it. Policies trained so far are listed under params.policies; their ONNX
# files live in their run folders (not committed), so drop a line whose run is gone.
#   python -m training.launch --config eval/configs/route_follow_worlds.yaml --device cpu
name: route_follow_worlds
entrypoint: eval.route_follow
seed: 7400
expected_hours: 0.5
gpus: 1
params:
  num_envs: 256
  episodes: 1
  policies:
    v0: runs/20261101-174152_route_follow_ppo_s0_cdbaa61/policy.onnx
  env:
    airframe: gz_x500_sitl
    episode_length_s: 30.0
    contact_radius_m: 0.40
  sets:
    - name: drift  # arched roof on vertical walls, as wide as a corridor
      env: {route: {tunnel_prob: 0.0, arch_prob: 1.0}}
    - name: drift_ranges
      env: {route: {tunnel_prob: 0.0, arch_prob: 1.0}, ranges: {present_prob: 1.0}}
    - name: pipe  # round, 0.8 to 1.1 m radius: 0.4 to 0.7 m from the props to the wall
      env: {route: {tunnel_prob: 1.0, tunnel_radius_m: [0.8, 1.1]}}
    - name: pipe_ranges
      env: {route: {tunnel_prob: 1.0, tunnel_radius_m: [0.8, 1.1]}, ranges: {present_prob: 1.0}}
    - name: pinch  # half the segments narrowed to 0.6 to 0.85 of the cross-section
      env: {route: {pinch_prob: 0.5}}
    - name: pinch_ranges
      env: {route: {pinch_prob: 0.5}, ranges: {present_prob: 1.0}}
    - name: junction  # three dead-end side passages per route
      env: {route: {branches: 3}}
    - name: junction_ranges
      env: {route: {branches: 3}, ranges: {present_prob: 1.0}}
    - name: ramp  # slopes up to 25 degrees
      env: {route: {climb_deg: [-25.0, 25.0]}}
    - name: ramp_ranges
      env: {route: {climb_deg: [-25.0, 25.0]}, ranges: {present_prob: 1.0}}
    - name: mixed_ranges  # everything at once, rangefinders on 70 % of the beams
      env:
        route: {arch_prob: 0.4, pinch_prob: 0.3, pinch_frac: [0.7, 0.9], branches: 2,
                branch_prob: 0.5, climb_deg: [-20.0, 20.0], tunnel_radius_m: [0.9, 2.0]}
        ranges: {present_prob: 0.7, outlier_prob: 0.01}
smoke:
  num_envs: 8
  policies: {}
  env:
    airframe: gz_x500_sitl
    episode_length_s: 8.0
    contact_radius_m: 0.40
