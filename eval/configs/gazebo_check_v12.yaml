# The Gazebo-like check (eval/configs/gazebo_check.yaml, everything but the controllers and
# the name) with the v12 candidate (training/configs/structure_hold_ppo_v12.yaml, run
# 20261023-140240) beside v10 (the reference) and v11.
#   python -m training.launch --config eval/configs/gazebo_check_v12.yaml --device cpu
name: gazebo_check_v12
entrypoint: eval.gazebo_check
seed: 7001  # unused: the check's seeds are params.seeds
expected_hours: 0.9
gpus: 1
params:
  controllers:
    - name: v10
      policy: training/policies/structure_hold_v10.onnx
    - name: v11
      policy: training/policies/structure_hold_v11.onnx
    - name: v12
      policy: training/policies/structure_hold_v12.onnx  # run 20261023-140240, byte-identical
  # The released policy, flown in Gazebo (PR #44). Before it: v6, then v9 (PR #42).
  reference: v10
  seeds: [7001, 7002]  # outside the Gate 1 held-out block (9000-9999)
  num_envs: 64
  window_s: 40.0  # lift and wobble over the last 40 s (the first 20 s hold the engage transient)
  wobble_threshold: 0.1  # roll action 1.2-2.2 Hz rms; Gazebo wobbling 0.22-0.35, quiet 0.003-0.06
  bootstrap: 2000
  rules:
    max_crash_increase: 0.01
    clean_p95_slack_m: 0.02
  base_env:
    airframe: gz_x500_sitl
    # The x500's props reach up to 0.40 m from its centre: rotors 0.24 to 0.26 m from
    # the centre (airframes.py) plus the 0.14 m prop radius. Gazebo's v11 strikes began at
    # 0.35 to 0.40 m (PR #49 seed 3). The scorer's default is a 5-inch quad's 0.25 m.
    contact_radius_m: 0.40
    episode_length_s: 60.0  # the benchmark's 60 s hover
    hold_distance: 1.0  # wall1m_* scenarios
    hold_height: 2.4  # where the module's hold point sits at the 2.5 m hover
    start_offset_std_m: 0.0  # the module engages at the hold point
    start_yaw_std_rad: 0.0
    # vio_default (sim2real/estimate_bridge/profiles), stated in full so a later change of a
    # default cannot silently move the check.
    estimate:
      delay_min_s: 0.05
      delay_max_s: 0.15
      pos_noise_std_m: 0.02
      vel_noise_std_mps: 0.05
      bias_walk_std_m_per_sqrt_s: 0.01
      bias_max_m: 0.3
      jump_rate_hz: 0.02
      jump_min_m: 0.1
      jump_max_m: 2.0
      jump_decay_s: 5.0
      dropout_rate_hz: 0.02
      dropout_min_s: 0.2
      dropout_max_s: 3.0
      dropout_mode: dead_reckon
      dropout_accel_bias_mps2: 0.3
    disturbance:
      # The wall1m_* scenarios: both gusts 15 to 40 s into the hover, 1 to 2 s long. The mock
      # draws the wind direction over the compass; Gazebo blows it into the wall.
      num_gusts: 2
      gust_start: [15.0, 40.0]
      gust_duration: [1.0, 2.0]
      turb_tau: 1.0
  cells:
    - name: calm_clean
      label: "calm, clean estimate"
      rough: false
      env:
        estimate: {delay_min_s: 0.0, delay_max_s: 0.0, pos_noise_std_m: 0.0,
                   vel_noise_std_mps: 0.0, bias_walk_std_m_per_sqrt_s: 0.0, bias_max_m: 0.0,
                   jump_rate_hz: 0.0, dropout_rate_hz: 0.0}
        disturbance: {mean_speed: 0.0, num_gusts: 0, turb_sigma: 0.0}
    - name: calm
      label: "calm, vio_default"
      env: {disturbance: {mean_speed: 0.0, num_gusts: 0, turb_sigma: 0.0}}
    - name: wind4
      label: "4 m/s, vio_default"
      env: {disturbance: {mean_speed: 4.0, gust_speed: [1.0, 3.0], turb_sigma: 0.5}}
    - name: wind8
      label: "8 m/s, vio_default"
      env: {disturbance: {mean_speed: 8.0, gust_speed: [2.0, 4.0], turb_sigma: 1.0}}
    # As Gazebo flies it: the mean wind blows into the wall (wall1m_wind_8ms,
    # wind_heading_deg 0; the gusts keep a random direction there too). v9 drifted up to 1 m
    # off the hold point in one of its three 8 m/s Gazebo flights; a steady wind into the
    # wall brings out the same slow drift in the mock (docs/gazebo_check.md).
    - name: wind8_wall
      label: "8 m/s into the wall, vio_default"
      env: {disturbance: {mean_speed: 8.0, mean_heading_deg: 0.0, gust_speed: [2.0, 4.0],
                          turb_sigma: 1.0}}
    # The benchmark's post-hold sequence (sim2real/px4/sitl_test.py): hold, stock Position
    # mode, re-engage with the hold point captured from the estimate then
    # (eval.gazebo_check.fly_reengage). Scored: no crash after a re-engage whose hold point
    # sits at least sane_m off the wall, and no more crashes in the hold than the reference.
    - name: reengage
      label: "4 m/s, hold / stock / re-engage, vio_default"
      reengage: {disengage_s: 20.0, stock_s: 5.4, after_s: 14.6, sane_m: 0.6}
      env: {disturbance: {mean_speed: 4.0, gust_speed: [1.0, 3.0], turb_sigma: 0.5,
                          gust_start: [5.0, 35.0]}}
    # Gazebo seed 3: a 1.4 m vision jump toward the wall shortly before the switch. EKF2
    # resets onto it, stock Position mode moves its setpoint with the reset, and the
    # re-engage captures a hold point at the wall; the v11 flights struck it, v10's (reset
    # 1.3 s before the switch, not within 0.4 s of it) did not. Not scored: no controller that
    # holds the estimate can avoid the wall from there (docs/gazebo_check.md).
    - name: reengage_jump
      label: "4 m/s, re-engage after a 1.4 m jump toward the wall"
      scored: false
      reengage: {disengage_s: 20.0, stock_s: 5.4, after_s: 14.6, sane_m: 0.6, jump_m: 1.4,
                 jump_lead_s: [0.5, 3.0]}
      env: {disturbance: {mean_speed: 4.0, gust_speed: [1.0, 3.0], turb_sigma: 0.5,
                          gust_start: [5.0, 35.0]}}
  # What v6, v8, v9 and v10 did in Gazebo (PR #35, #37, #42, #44; per flight from the exported
  # traces, on this check's definitions: lift and wobble over the last 40 s). Printed beside
  # the mock. Gazebo's 4 and 8 m/s winds blow into the wall, so its 8 m/s numbers sit under
  # both wind8 and wind8_wall.
  gazebo:
    v6:
      calm_clean: {p95_m: 0.11, lift_m: 0.04, wobble: "0/1"}
      calm: {p95_m: 0.62, lift_m: 0.21, wobble: "2/3"}
      wind4: {p95_m: 0.64, lift_m: 0.23, wobble: "2/3"}
      wind8: {p95_m: 0.68, lift_m: 0.32, wobble: "2/3"}
      wind8_wall: {p95_m: 0.68, lift_m: 0.32, wobble: "2/3"}
    v8:
      calm_clean: {p95_m: 0.11, lift_m: -0.01, wobble: "0/1"}
      calm: {p95_m: 0.67, lift_m: 0.39, wobble: "3/3"}
      wind4: {p95_m: 0.68, lift_m: 0.41, wobble: "3/3"}
      wind8: {p95_m: 0.79, lift_m: 0.48, wobble: "3/3"}
      wind8_wall: {p95_m: 0.79, lift_m: 0.48, wobble: "3/3"}
    v9:
      calm_clean: {p95_m: 0.08, lift_m: 0.04, wobble: "0/1"}
      calm: {p95_m: 0.44, lift_m: 0.06, wobble: "0/3"}
      wind4: {p95_m: 0.49, lift_m: 0.07, wobble: "0/3"}
      wind8: {p95_m: 0.64, lift_m: 0.06, wobble: "0/3"}
      wind8_wall: {p95_m: 0.64, lift_m: 0.06, wobble: "0/3"}
    v10:
      calm_clean: {p95_m: 0.04, lift_m: 0.03, wobble: "0/1"}
      calm: {p95_m: 0.38, lift_m: 0.04, wobble: "0/3"}
      wind4: {p95_m: 0.38, lift_m: 0.05, wobble: "0/3"}
      wind8: {p95_m: 0.39, lift_m: 0.05, wobble: "0/3"}
      wind8_wall: {p95_m: 0.39, lift_m: 0.05, wobble: "0/3"}
smoke:
  num_envs: 4
  bootstrap: 50
  seeds: [7001]
  window_s: 1.0
  reengage_scale: 0.05  # the 40 s sequence in 2 s
  base_env:  # replaces base_env whole (launch merges the smoke block one level deep)
    airframe: gz_x500_sitl
    episode_length_s: 2.0
    hold_distance: 1.0
    hold_height: 2.4
