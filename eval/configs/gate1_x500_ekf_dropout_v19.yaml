# What a Gate 1 stress dropout cell capped at 3 s would show (Zain, 2026-10-24: "What if the
# limit was 3 seconds"; docs/decisions.md rule 5 row, Proposed). v19 and the PD on the x500
# through the EKF2-like fusion, the stress set's base condition (mean wind 0 to 8 m/s, hold 1
# to 2 m), on diagnostic seeds outside the held-out block: this informs the rule, it is not
# a Gate 1 verdict. Cells: the nominal dropouts (0.2 to 3 s at 0.02 Hz), the same lengths at
# the stress rate (0.05 Hz), the stress cell capped at 3 s (2 to 3 s at 0.05 Hz) and the
# stress cell as written (3 to 5 s at 0.05 Hz).
#   python -m training.launch --config eval/configs/gate1_x500_ekf_dropout_v19.yaml --device cpu
name: gate1_x500_ekf_dropout_v19
entrypoint: eval.gate1
seed: 9001  # unused: the protocol seeds are params.seeds
expected_hours: 0.4  # four cells, two seeds
gpus: 1
params:
  controllers:
    - name: v19
      policy: training/policies/structure_hold_v19.onnx  # released (PR #61), iteration 13500
  gate_controller: v19
  seeds: [8001, 8002]  # diagnostic, outside the held-out block 9000-9999
  num_envs: 1024
  bootstrap: 2000
  base_env:
    airframe: gz_x500
    # EKF2-like fusion as gz_x500_sitl has it (envs/structure_hold/airframes.py).
    fusion: {enabled: true, vision_rate_hz: 50.0, ev_delay_s: 0.1, pos_noise_m: 0.1,
             vel_noise_mps: 0.1, gate_sd: 5.0, resets: true}
    # The standard estimate corruption (eval rates, not the 5x training rates), stated in
    # full so a later change of a default cannot silently move the test set.
    estimate:
      delay_min_s: 0.05
      delay_max_s: 0.15
      pos_noise_std_m: 0.02
      vel_noise_std_mps: 0.05
      bias_walk_std_m_per_sqrt_s: 0.01
      bias_max_m: 0.3
      jump_rate_hz: 0.02
      jump_min_m: 0.1
      jump_max_m: 2.0
      jump_decay_s: 5.0
      dropout_rate_hz: 0.02
      dropout_min_s: 0.2
      dropout_max_s: 3.0
      dropout_mode: dead_reckon
      dropout_accel_bias_mps2: 0.3
    disturbance:
      # Held-out gust schedule: both gusts start inside the 20 s episode (training draws
      # starts up to 50 s). Gust speed and length stay inside the training ranges.
      num_gusts: 2
      gust_start: [2.0, 16.0]
      gust_duration: [0.5, 3.0]
      gust_speed: [2.0, 5.0]
      turb_sigma: [0.0, 1.5]
      mean_speed: [0.0, 8.0]  # the stress set's base condition, drawn per episode
    hold_distance: [1.0, 2.0]
  rules:
    p95_headline_reduction: 0.30
    max_pooled_crash_rate: 0.10  # rule 5's stress ceiling
  cells:
    - {name: drop_nominal, label: "dropouts 0.2-3 s, 0.02 Hz (nominal)"}
    - {name: drop3_005, label: "dropouts 0.2-3 s, 0.05 Hz", env: {estimate: {dropout_rate_hz: 0.05}}}
    - {name: drop2to3, label: "dropouts 2-3 s, 0.05 Hz (stress cell capped at 3 s)", env: {estimate: {dropout_min_s: 2.0, dropout_max_s: 3.0, dropout_rate_hz: 0.05}}}
    - {name: drop3to5, label: "dropouts 3-5 s, 0.05 Hz (stress cell as written)", env: {estimate: {dropout_min_s: 3.0, dropout_max_s: 5.0, dropout_rate_hz: 0.05}}}
smoke:
  num_envs: 6
  bootstrap: 50
  seeds: [8001]
  base_env:
    airframe: gz_x500
    episode_length_s: 2.0
    fusion: {enabled: true, vision_rate_hz: 50.0, ev_delay_s: 0.1, pos_noise_m: 0.1,
             vel_noise_mps: 0.1, gate_sd: 5.0, resets: true}
